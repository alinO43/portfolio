    <link rel="stylesheet" href="./styles.css" />

  <body class="page">
    <header class="topbar">
      <a class="topbar__home" href="./index.html" aria-label="На главную">

        <a class="button" href="./Резюме.pdf" download="Резюме.pdf">

    <main class="case case--detail case--landing">

            <br />
            Ссылка на реализованный продукт
            <a

              href="https://find-landing-zeta.vercel.app/"
              target="_blank"
              rel="noreferrer"

            >
          </p>
          <figure class="case-hero__cover case-image case-image--rounded-30">
            <img
              class="case-image__img"
              src="./images/landing/hero-cover.png"
              alt="Обложка лэндинга FIND Analytics на ноутбуке"
            />

      <figure class="case-landing__scroll case-image case-image--rounded-30">
        <img
